<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#020408"><title>TMS | Admin Dashboard</title>
<style>
:root{--bg:#020408;--surface:rgba(13,18,28,.95);--green:#10b981;--bright:#4ade80;--cyan:#06b6d4;--muted:#94a3b8;--border:rgba(16,185,129,.4)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f8fafc;font:15px 'Segoe UI',system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.layout{min-height:100vh;display:grid;grid-template-columns:265px minmax(0,1fr)}aside{background:var(--surface);border-right:1px solid var(--border);padding:28px 18px}.brand{text-align:center;margin-bottom:30px}.brand .logo{width:74px;height:74px;margin:auto auto 12px;border-radius:50%;border:2px solid var(--bright);display:grid;place-items:center;font-weight:900;font-size:24px;color:var(--bright);box-shadow:0 0 22px #10b98155}.brand h2{margin:0;color:var(--bright)}.brand small{color:var(--muted)}nav{display:grid;gap:10px}nav button{background:#06090f;border:1px solid #10b98133;border-radius:12px;color:#fff;padding:14px;text-align:left;font-weight:600}nav button.active,nav button:hover{background:#10b98133;border-color:var(--bright)}main{padding:26px;max-width:1400px;width:100%;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}h1{font-size:27px;margin:0;background:linear-gradient(90deg,#fff,var(--bright),var(--cyan));background-clip:text;color:transparent}h2{font-size:20px;margin:0 0 16px;color:var(--bright)}p{color:var(--muted)}.notice{border:1px solid #06b6d466;background:#06b6d414;color:#a5f3fc;padding:13px;border-radius:12px;margin-bottom:20px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:22px;box-shadow:0 14px 30px #0008}.metric{font-size:32px;font-weight:800;color:var(--bright)}.label{color:var(--muted);font-size:13px}.panel{margin-top:20px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}input,select{background:#06090f;color:white;border:1px solid #64748b66;border-radius:10px;padding:12px;min-width:0}input:focus,select:focus{outline:2px solid var(--green)}.btn{background:linear-gradient(135deg,#059669,#10b981,#0891b2);color:white;border:0;border-radius:10px;padding:11px 16px;font-weight:700}.btn.secondary{background:#1e293b}.btn.danger{background:#991b1b}.btn:disabled{opacity:.45;cursor:not-allowed}.item{display:flex;justify-content:space-between;align-items:center;gap:15px;border:1px solid #94a3b833;background:#06090f88;border-radius:12px;padding:15px;margin-top:10px;flex-wrap:wrap}.item strong{display:block}.item small{color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.pill{font-size:12px;border-radius:20px;padding:5px 10px;background:#10b98122;color:var(--bright)}.pill.locked{background:#f59e0b22;color:#fbbf24}.hidden{display:none}.empty{padding:20px;text-align:center;color:var(--muted)}.mobile-nav{display:none}@media(max-width:800px){.layout{display:block}aside{display:none}main{padding:15px}.mobile-nav{display:flex;gap:8px;overflow:auto;padding:10px 0}.mobile-nav button{flex:0 0 auto;background:#0d121c;border:1px solid var(--border);color:white;border-radius:10px;padding:10px}.cards{grid-template-columns:1fr}.card{padding:17px}h1{font-size:22px}}
.toolbar[hidden]{display:none}button:disabled{opacity:.55;cursor:default}.media-editor{flex-basis:100%;align-items:center}.media-editor input,.media-editor select{max-width:100%}.access-dialog{width:min(660px,calc(100% - 24px));max-height:90vh;overflow:auto;background:var(--surface);color:#fff;border:1px solid var(--border);border-radius:16px;padding:20px}.access-dialog::backdrop{background:#000b}.access-list{display:grid;gap:12px;margin:16px 0}.access-list fieldset{min-width:0;border:1px solid var(--border);border-radius:10px}.access-choice{display:flex;align-items:baseline;gap:8px;margin:7px 0}.access-dialog .actions{position:sticky;bottom:0;background:var(--surface);padding-block:8px}</style></head><body><div class="layout"><aside><div class="brand"><div class="logo">TMS</div><small>TRADER SAJJAD SHAH</small><h2>Admin Dashboard</h2></div><nav id="desktop-nav"></nav></aside><main><header><div><h1>TMS | Admin Dashboard</h1><p>Private Mentorship Management</p></div><a href="/" class="pill">Student Portal</a></header><div class="mobile-nav" id="mobile-nav"></div>
<section class="card" id="auth-panel" style="margin-bottom:20px"><h2>Admin Sign-in</h2><p id="auth-status">Checking Firebase configuration…</p><form id="auth-form" class="toolbar"><input id="auth-email" type="email" autocomplete="username" placeholder="Email" required><input id="auth-password" type="password" autocomplete="current-password" placeholder="Password" required><button class="btn" type="submit">Sign in</button></form><div class="toolbar"><button class="btn secondary" id="auth-reset" type="button">Reset password</button><button class="btn secondary" id="auth-logout" type="button" hidden>Sign out</button></div><p id="auth-feedback" role="status"></p></section><section id="overview" class="hidden"><div class="cards"><div class="card"><div class="label">Students</div><div class="metric" id="total">0</div></div><div class="card"><div class="label">Active Students</div><div class="metric" id="active">0</div></div><div class="card"><div class="label">Course Nodes</div><div class="metric">11</div></div></div></section>
<section id="students" class="hidden"><div class="card"><h2>Student Management</h2>
<form class="toolbar" id="student-create"><input id="student-name" placeholder="Student name" maxlength="120" required><input id="student-email" type="email" placeholder="Student email" maxlength="254" required><button class="btn">Create Student Account</button></form>
<div id="setup-link"></div><div id="student-list"></div></div></section>
<section id="lectures" class="hidden"><div class="card"><h2>Manual Lecture Lock / Unlock</h2><div id="node-list"></div></div></section>
<section id="devices" class="hidden"><div class="card"><h2>Device Lock Management</h2><div id="device-list"></div></div></section>
<script src="/course-data.js"></script><script src="/firebase-client-config.js"></script><script type="module" src="/admin-client.js"></script></main></div></body></html>
