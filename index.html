<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <meta name="description" content="Official Student Access Portal for TMS Mentorship by Trader Sajjad">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TMS Portal">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trader Sajjad | Student Portal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #07080a;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* INTERACTIVE NEON CURSOR BACKGROUND ANIMATION */
    #neon-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .container {
      width: 100%;
      max-width: 600px;
      padding: 20px;
      position: relative;
      z-index: 2;
    }

    .hidden { display: none !important; }

    /* Card & Panel Styling */
    .card {
      background: rgba(22, 25, 34, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(41, 98, 255, 0.3);
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), 0 0 20px rgba(41, 98, 255, 0.1);
    }

    .card h2 { margin-bottom: 10px; color: #3b82f6; text-shadow: 0 0 10px rgba(59, 130, 246, 0.5); }
    .card p { color: #94a3b8; margin-bottom: 20px; }

    form input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 6px;
      border: 1px solid #1e293b;
      background: #0c0d10;
      color: #fff;
      font-size: 15px;
    }

    form input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 8px rgba(59, 130, 246, 0.4);
    }

    button {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: none;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
      transition: 0.3s;
    }

    button:hover {
      background: linear-gradient(135deg, #1d4ed8, #1e40af);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.6);
    }

    .error { color: #f87171; margin-top: 15px; display: none; }

    /* Dashboard & Scrollable Lists */
    .section-title {
      font-size: 20px;
      color: #4ade80;
      margin-bottom: 15px;
      font-weight: bold;
      text-shadow: 0 0 8px rgba(74, 222, 128, 0.4);
    }

    .scroll-box {
      max-height: 420px;
      overflow-y: auto;
      padding-right: 5px;
    }

    .scroll-box::-webkit-scrollbar {
      width: 6px;
    }
    .scroll-box::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 4px;
    }

    .list-item {
      background: rgba(22, 25, 34, 0.85);
      backdrop-filter: blur(5px);
      border: 1px solid rgba(42, 46, 61, 0.7);
      padding: 14px 18px;
      border-radius: 10px;
      margin-bottom: 10px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s ease;
    }

    .list-item:hover {
      border-color: #3b82f6;
      background: rgba(30, 34, 45, 0.95);
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.25);
      transform: translateY(-1px);
    }

    .list-item h4 { font-size: 14px; color: #fff; font-weight: 500; }
    .list-item span { color: #94a3b8; font-size: 13px; }

    .play-icon {
      color: #4ade80;
      margin-right: 10px;
      font-size: 14px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      background: rgba(22, 25, 34, 0.85);
      backdrop-filter: blur(10px);
      padding: 15px;
      border-radius: 10px;
      border: 1px solid rgba(42, 46, 61, 0.7);
    }

    .back-btn {
      background: #1e293b;
      width: auto;
      padding: 6px 14px;
      font-size: 14px;
      margin-bottom: 15px;
      cursor: pointer;
      box-shadow: none;
    }
    .back-btn:hover { background: #334155; }

    .logout-btn {
      background: #dc2626;
      width: auto;
      padding: 6px 12px;
      font-size: 14px;
      box-shadow: none;
    }
    .logout-btn:hover { background: #b91c1c; }

    /* Video Player */
    .video-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 20px rgba(59, 130, 246, 0.2);
      margin-top: 10px;
      border: 1px solid rgba(59, 130, 246, 0.4);
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .watermark {
      position: absolute;
      color: rgba(255, 255, 255, 0.4);
      font-size: 15px;
      font-weight: bold;
      pointer-events: none;
      z-index: 99;
      user-select: none;
      transition: all 1.5s ease-in-out;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.9);
    }
  </style>
</head>
<body>

  <!-- Background Neon Interactive Canvas Animation -->
  <canvas id="neon-canvas"></canvas>

  <!-- 1. LOGIN SCREEN -->
  <div id="login-screen" class="container">
    <div class="card">
      <h2>Trader Sajjad Portal</h2>
      <p>Enter your authorized student credentials</p>
      <form id="login-form">
        <input type="email" id="email-input" placeholder="Student Email" required>
        <input type="password" id="password-input" placeholder="Access Password" required>
        <button type="submit">Login</button>
      </form>
      <div id="error-msg" class="error">Invalid Credentials!</div>
    </div>
  </div>

  <!-- 2. COURSES SCREEN -->
  <div id="courses-screen" class="container hidden">
    <div class="top-bar">
      <div>
        <h4 style="color:#4ade80;">Welcome</h4>
        <p id="user-display" style="font-size:13px; color:#94a3b8;"></p>
      </div>
      <button class="logout-btn" onclick="location.reload()">Logout</button>
    </div>

    <div class="section-title">My Courses</div>
    
    <div class="list-item" onclick="openBatch1Chapters()">
      <div>
        <h4>TMS Batch 1 lectures</h4>
        <span style="color:#4ade80;">TMS Node 1 Available</span>
      </div>
      <span>➔</span>
    </div>
  </div>

  <!-- 3. CHAPTERS SCREEN -->
  <div id="chapters-screen" class="container hidden">
    <button class="back-btn" onclick="showScreen(coursesScreen)">❮ Back to Courses</button>
    <div class="section-title">TMS Batch 1 Modules</div>
    <div id="modules-list-container" class="scroll-box"></div>
  </div>

  <!-- 4. LECTURES LIST SCREEN -->
  <div id="lectures-list-screen" class="container hidden">
    <button class="back-btn" onclick="showScreen(chaptersScreen)">❮ Back to Chapters</button>
    <div id="module-title-heading" class="section-title"></div>
    <div id="lectures-container" class="scroll-box"></div>
  </div>

  <!-- 5. VIDEO PLAYER SCREEN -->
  <div id="video-player-screen" class="container hidden" style="max-width: 850px;">
    <button class="back-btn" onclick="goBackFromVideo()">❮ Back to Lectures</button>
    <h3 id="current-playing-title" style="color: #4ade80; margin-bottom: 12px; font-size: 16px;"></h3>

    <div class="video-wrapper">
      <div id="watermark-overlay" class="watermark"></div>
      <!-- Bunny.net secure iframe player container -->
      <div id="iframe-container" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;"></div>
    </div>
  </div>

  <script>
    // Valid Students Database
    const validStudents = {
      "bgsameer420@gmail.com": "bgsameer",
      "arsalan125@gmail.com": "arsalan123"
    };

    // TMS Batch 1 Nodes Data Structure with Bunny.net embed links
    const batch1Nodes = [
      {
        title: "TMS NODE 1: (Liquidity & Inefficiency)",
        lectures: [
          { title: "LEC 1: Introduction to TMS - The Mystery Syndicate", url: "https://iframe.mediadelivery.net/embed/803385/dff20229-1e6e-44fc-a3eb-8d8113a3da7e?autoplay=true" },
          { title: "LEC 2: ICT VOLUME IMBALANCE", url: "https://iframe.mediadelivery.net/embed/803385/YOUR_NEXT_VIDEO_ID_HERE?autoplay=true" }
        ]
      }
    ];

    let currentUserEmail = "";
    let activeModuleIndex = 0;

    // DOM Elements
    const loginForm = document.getElementById('login-form');
    const loginScreen = document.getElementById('login-screen');
    const coursesScreen = document.getElementById('courses-screen');
    const chaptersScreen = document.getElementById('chapters-screen');
    const lecturesListScreen = document.getElementById('lectures-list-screen');
    const videoPlayerScreen = document.getElementById('video-player-screen');
    
    const modulesListContainer = document.getElementById('modules-list-container');
    const lecturesContainer = document.getElementById('lectures-container');
    const moduleTitleHeading = document.getElementById('module-title-heading');
    const currentPlayingTitle = document.getElementById('current-playing-title');
    const iframeContainer = document.getElementById('iframe-container');
    const watermarkOverlay = document.getElementById('watermark-overlay');

    function showScreen(screenToShow) {
      [loginScreen, coursesScreen, chaptersScreen, lecturesListScreen, videoPlayerScreen].forEach(s => s.classList.add('hidden'));
      screenToShow.classList.remove('hidden');
      if (screenToShow !== videoPlayerScreen) {
        iframeContainer.innerHTML = ""; // Stop video when leaving screen
      }
    }

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email-input').value;
      const password = document.getElementById('password-input').value;

      if (validStudents[email] && validStudents[email] === password) {
        currentUserEmail = email;
        document.getElementById('user-display').innerText = email;
        showScreen(coursesScreen);
        initSecurity();
      } else {
        document.getElementById('error-msg').style.display = 'block';
      }
    });

    function openBatch1Chapters() {
      modulesListContainer.innerHTML = "";
      batch1Nodes.forEach((node, index) => {
        const item = document.createElement('div');
        item.className = 'list-item';
        item.onclick = () => openLecturesList(index);
        item.innerHTML = `
          <h4>${node.title}</h4>
          <span style="color:#3b82f6;">${node.lectures.length} Videos</span>
        `;
        modulesListContainer.appendChild(item);
      });
      showScreen(chaptersScreen);
    }

    function openLecturesList(nodeIndex) {
      activeModuleIndex = nodeIndex;
      const selectedNode = batch1Nodes[nodeIndex];
      moduleTitleHeading.innerText = selectedNode.title;
      lecturesContainer.innerHTML = "";

      selectedNode.lectures.forEach((lec) => {
        const item = document.createElement('div');
        item.className = 'list-item';
        item.onclick = () => playSelectedVideo(lec.title, lec.url);
        item.innerHTML = `
          <div style="display:flex; align-items:center;">
            <span class="play-icon">▶</span>
            <h4>${lec.title}</h4>
          </div>
          <span>Watch</span>
        `;
        lecturesContainer.appendChild(item);
      });

      showScreen(lecturesListScreen);
    }

    function playSelectedVideo(title, videoUrl) {
      currentPlayingTitle.innerText = title;
      // Inject Bunny.net secure iframe player
      iframeContainer.innerHTML = `<iframe src="${videoUrl}" loading="lazy" style="border:0;position:absolute;top:0;height:100%;width:100%;" allow="accelerometer;gyroscope;autoplay;encrypted-media;picture-in-picture;" allowfullscreen="true"></iframe>`;
      showScreen(videoPlayerScreen);
      initWatermark(currentUserEmail);
    }

    function goBackFromVideo() {
      iframeContainer.innerHTML = "";
      showScreen(lecturesListScreen);
    }

    // Floating Watermark Logic
    function initWatermark(email) {
      watermarkOverlay.innerText = email;
      setInterval(() => {
        const top = Math.floor(Math.random() * 75) + 10;
        const left = Math.floor(Math.random() * 65) + 10;
        watermarkOverlay.style.top = top + '%';
        watermarkOverlay.style.left = left + '%';
      }, 2500);
    }

    // NEON INTERACTIVE BACKGROUND ANIMATION SCRIPT
    const canvas = document.getElementById('neon-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let mouse = { x: null, y: null, radius: 150 };

    function resizeCanvas() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    window.addEventListener('click', (e) => {
      createRipple(e.clientX, e.clientY);
    });

    let ripples = [];
    function createRipple(x, y) {
      ripples.push({ x: x, y: y, radius: 10, alpha: 1 });
    }

    let particles = [];
    for (let i = 0; i < 40; i++) {
      particles.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        vx: (Math.random() - 0.5) * 0.8,
        vy: (Math.random() - 0.5) * 0.8,
        size: Math.random() * 2 + 1
      });
    }

    function animateNeon() {
      ctx.clearRect(0, 0, width, height);

      ctx.fillStyle = 'rgba(59, 130, 246, 0.3)';
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < 0 || p.x > width) p.vx *= -1;
        if (p.y < 0 || p.y > height) p.vy *= -1;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();

        if (mouse.x !== null && mouse.y !== null) {
          let dx = p.x - mouse.x;
          let dy = p.y - mouse.y;
          let dist = Math.sqrt(dx*dx + dy*dy);
          if (dist < 150) {
            ctx.strokeStyle = `rgba(37, 99, 235, ${1 - dist/150})`;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(mouse.x, mouse.y);
            ctx.stroke();
          }
        }
      });

      if (mouse.x !== null && mouse.y !== null) {
        let gradient = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 180);
        gradient.addColorStop(0, 'rgba(37, 99, 235, 0.15)');
        gradient.addColorStop(1, 'rgba(7, 8, 10, 0)');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, width, height);
      }

      ripples.forEach((r, index) => {
        r.radius += 4;
        r.alpha -= 0.03;
        if (r.alpha <= 0) {
          ripples.splice(index, 1);
          return;
        }
        ctx.strokeStyle = `rgba(59, 130, 246, ${r.alpha})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
        ctx.stroke();
      });

      requestAnimationFrame(animateNeon);
    }
    animateNeon();

    function initSecurity() {
      document.addEventListener('contextmenu', e => e.preventDefault());
      document.addEventListener('keydown', e => {
        if (
          e.key === 'F12' ||
          (e.ctrlKey && e.shiftKey && e.key === 'I') ||
          (e.ctrlKey && e.shiftKey && e.key === 'J') ||
          (e.ctrlKey && e.key === 'u')
        ) {
          e.preventDefault();
        }
      });
    }
  </script>
</body>
</html>
