<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#020408"><title>Trader Sajjad Shah | Student Portal</title><style>
:root{--bg:#020408;--surface:rgba(13,18,28,.95);--green:#10b981;--bright:#4ade80;--cyan:#06b6d4;--muted:#94a3b8;--border:rgba(16,185,129,.4)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f8fafc;font:15px 'Segoe UI',system-ui,sans-serif}button{font:inherit;cursor:pointer}.layout{min-height:100vh;display:grid;grid-template-columns:280px minmax(0,1fr)}aside{background:var(--surface);border-right:1px solid var(--border);padding:24px 18px}.logo{width:88px;height:88px;border:2px solid var(--bright);border-radius:50%;display:grid;place-items:center;color:var(--bright);font-size:27px;font-weight:900;box-shadow:0 0 20px #10b98155;margin:10px auto}.mentor{text-align:center;margin-bottom:28px}.mentor h2{color:var(--bright);margin:5px 0}.mentor small{color:var(--muted);letter-spacing:1px}nav{display:grid;gap:10px}nav button{background:#06090f;border:1px solid #10b98133;color:#fff;text-align:left;padding:14px;border-radius:12px;font-weight:600}nav button.active{background:#10b98133;border-color:var(--bright)}main{padding:26px;max-width:1150px;width:100%;margin:auto}header{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-size:22px;margin:0}h2{font-size:21px;margin:0 0 12px;color:var(--bright)}p,small{color:var(--muted)}.notice{border:1px solid #06b6d466;background:#06b6d414;color:#a5f3fc;padding:12px;border-radius:12px;margin-bottom:18px}.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:20px;box-shadow:0 20px 40px #0007}.item{background:#06090f99;border:1px solid #94a3b833;border-radius:13px;padding:16px;margin-top:10px;display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;color:#fff;text-align:left}.item:hover{border-color:var(--bright)}.item strong{display:block}.item small{display:block;margin-top:6px}.arrow{color:var(--bright);font-size:21px}.hidden{display:none}.back{background:#1e293b;border:1px solid #64748b66;color:white;border-radius:10px;padding:10px 16px;margin-bottom:16px}.status{color:#fbbf24;font-size:12px}.mobile-mentor{display:none}.video{aspect-ratio:16/9;background:#000;border:2px solid var(--border);border-radius:15px;display:grid;place-items:center;text-align:center;padding:22px;color:var(--muted)}.video:has(iframe){padding:0;overflow:hidden}.video iframe{width:100%;height:100%;border:0}@media(max-width:768px){.layout{display:block}aside{display:none}main{padding:14px}.mobile-mentor{display:block;text-align:center;margin-bottom:16px;padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:16px}.mobile-mentor .logo{width:58px;height:58px;font-size:18px}header{padding:14px}h1{font-size:18px}}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}.toolbar input{font:inherit;background:var(--bg);color:inherit;border:1px solid var(--border);border-radius:10px;padding:10px}.toolbar[hidden]{display:none}button:disabled{opacity:.55;cursor:default}
.video{position:relative}.player-watermark{position:absolute;z-index:1;top:12%;left:5%;max-width:85%;overflow-wrap:anywhere;background:#03140cdd;color:#6dffa8;border:1px solid #39db8966;padding:5px 9px;border-radius:6px;text-align:left;font-size:clamp(.65rem,2vw,.9rem);line-height:1.25;pointer-events:none;animation:tms-watermark 28s infinite alternate}.player-watermark strong,.player-watermark span{display:block;color:inherit}.player-fullscreen{position:absolute;z-index:2;top:8px;right:8px;background:#09120e;color:white;border:1px solid var(--border);border-radius:8px;padding:6px 10px}.video:fullscreen{width:100%;height:100%;border:0;border-radius:0}.video.player-expanded{position:fixed;inset:0;z-index:1000;width:100%;height:100%;border:0;border-radius:0}.video:fullscreen iframe,.video.player-expanded iframe{position:absolute;inset:0;width:100%;height:100%}@keyframes tms-watermark{0%{top:12%;left:5%}50%{top:38%;left:95%;transform:translateX(-100%)}100%{top:60%;left:12%}}@media(prefers-reduced-motion:reduce){.player-watermark{animation:none}}</style></head><body><div class="layout"><aside><div class="mentor"><div class="logo">TMS</div><small>MENTOR</small><h2>Sajjad Shah</h2></div><nav><button id="nav-course" disabled class="active">My Course →</button><button id="nav-chapters" disabled>My Chapters →</button></nav></aside><main><header><div><h1>Welcome Student</h1><small>Trader Sajjad Shah | Private Mentorship</small></div><span style="color:var(--bright)">TMS</span></header><div class="mobile-mentor"><div class="logo">TMS</div><small>MENTOR</small><h2>Sajjad Shah</h2></div><section class="card" id="auth-panel" style="margin-bottom:20px"><h2>Student Sign-in</h2><p id="auth-status">Checking Firebase configuration…</p><form id="auth-form" class="toolbar"><input id="auth-email" type="email" autocomplete="username" placeholder="Email" required><input id="auth-password" type="password" autocomplete="current-password" placeholder="Password" required><button class="back" type="submit">Sign in</button></form><div class="toolbar"><button class="back" id="auth-reset" type="button">Reset password</button><button class="back" id="auth-logout" type="button" hidden>Sign out</button></div><p id="auth-feedback" role="status"></p></section><section id="course" class="hidden"><div class="card"><h2>My Course</h2><p>Official Mentorship Modules</p><button class="item" id="open-chapters"><span><strong>TMS Batch 1 Lectures</strong><small>Access all 11 core nodes</small></span><span class="arrow">➜</span></button></div></section><section id="chapters" class="hidden"><button class="back" data-back="course">❮ Back</button><div class="card"><h2>My Chapters</h2><p>TMS Batch 1 Modules</p><div id="nodes"></div></div></section><section id="lectures" class="hidden"><button class="back" data-back="chapters">❮ Back</button><div class="card"><h2 id="node-heading">Module Lectures</h2><p>Select a lecture</p><div id="lecture-list"></div></div></section><section id="player" class="hidden"><button class="back" data-back="lectures">❮ Back</button><div class="card"><h2 id="lecture-heading"></h2><div class="video"></div></div></section></main></div><script src="/course-data.js"></script><script src="/firebase-client-config.js"></script>
